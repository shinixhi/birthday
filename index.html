<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at center, #fff9f0 0%, #faede1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow: hidden;
      cursor: default;
      padding: 16px;
    }

    #card-container {
      position: relative;
      width: min(1000px, 100%);
      height: min(640px, 94vh);
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(186, 114, 114, 0.12), 0 4px 15px rgba(0, 0, 0, 0.03);
      display: flex;
      overflow: hidden;
      opacity: 0;
      transform: scale(0.96) translateY(16px);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #card-container.active {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    #info-panel {
      width: 46%;
      height: 100%;
      padding: clamp(24px, 4vw, 55px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
      opacity: 0;
      transform: translateX(-20px);
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
    }

    #info-panel.visible {
      opacity: 1;
      transform: translateX(0);
    }

    #typewriter {
      font-size: clamp(0.92rem, 1.8vw, 1.15rem);
      line-height: 1.7;
      color: #3d3434;
      white-space: pre-line;
      letter-spacing: 0.2px;
    }

    #typewriter::after {
      content: '|';
      color: #e63946;
      font-weight: 300;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #countdown-box {
      font-family: 'Montserrat', sans-serif;
      padding-top: 14px;
      margin-top: 12px;
      border-top: 1px solid rgba(230, 57, 70, 0.15);
    }

    #countdown-box .label {
      font-size: clamp(0.68rem, 1.3vw, 0.78rem);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
      color: #7d6b6b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #timer {
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 1px;
      color: #c92a2a;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      transition: transform 1.4s cubic-bezier(0.65, 0, 0.35, 1);
      transform: translate(0, 0);
    }

    #canvas-container.shifted {
      transform: translateX(23%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .mini-heart {
      color: #e03131;
      font-size: 0.85rem;
    }

    .cursor-heart {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      animation: floatUpFade 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      filter: drop-shadow(0 2px 4px rgba(230, 57, 70, 0.2));
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% - 65px)) scale(0.2) rotate(var(--rot));
      }
    }

    #intro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #ffffff 0%, #fdf5ec 100%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #intro-overlay.dismissed {
      opacity: 0;
      transform: scale(1.06);
      pointer-events: none;
    }

    #intro-heart-btn {
      width: 68px;
      height: 68px;
      background: #e63946;
      transform: rotate(-45deg);
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(230, 57, 70, 0.3);
      animation: heartbeat 1.8s infinite ease-in-out;
      margin-bottom: 35px;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #intro-heart-btn:hover, #intro-heart-btn:active {
      transform: scale(1.12) rotate(-45deg);
    }

    #intro-heart-btn::before,
    #intro-heart-btn::after {
      content: "";
      position: absolute;
      width: 68px;
      height: 68px;
      background: #e63946;
      border-radius: 50%;
    }

    #intro-heart-btn::before {
      top: -34px;
      left: 0;
    }

    #intro-heart-btn::after {
      left: 34px;
      top: 0;
    }

    @keyframes heartbeat {
      0% { transform: scale(1) rotate(-45deg); }
      14% { transform: scale(1.1) rotate(-45deg); }
      28% { transform: scale(1) rotate(-45deg); }
      42% { transform: scale(1.15) rotate(-45deg); }
      70% { transform: scale(1) rotate(-45deg); }
    }

    #intro-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9c6869;
      user-select: none;
      text-align: center;
      padding: 0 20px;
    }

    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      #card-container {
        flex-direction: column-reverse;
        height: 94vh;
        height: 94dvh;
      }
      #info-panel {
        width: 100%;
        height: 48%;
        padding: 16px 20px;
        transform: translateY(20px);
      }
      #info-panel.visible {
        transform: translateY(0);
      }
      #canvas-container {
        height: 52%;
        top: 0;
      }
      #canvas-container.shifted {
        transform: translate(0, 0);
      }
      #intro-heart-btn {
        width: 58px;
        height: 58px;
        margin-bottom: 25px;
      }
      #intro-heart-btn::before,
      #intro-heart-btn::after {
        width: 58px;
        height: 58px;
      }
      #intro-heart-btn::before {
        top: -29px;
      }
      #intro-heart-btn::after {
        left: 29px;
      }
    }
  </style>
</head>
<body>

  <div id="card-container">
    <div id="intro-overlay">
      <div id="intro-heart-btn"></div>
      <div id="intro-text">Tap the heart to open</div>
    </div>

    <div id="info-panel">
      <div id="typewriter"></div>

      <div id="countdown-box">
        <div class="label">
          Counting down to your birthday <span class="mini-heart">❤</span>
        </div>
        <div id="timer">Loading...</div>
      </div>
    </div>

    <div id="canvas-container">
      <canvas id="treeCanvas"></canvas>
    </div>
  </div>

  <script>
    const trailColors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c92a2a', '#e03131', '#f06595', '#ffb3c1'];

    function spawnTrailHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'cursor-heart';
      heart.innerHTML = '❤';
      heart.style.left = `${x}px`;
      heart.style.top = `${y}px`;
      heart.style.color = trailColors[Math.floor(Math.random() * trailColors.length)];
      heart.style.fontSize = `${Math.random() * 12 + 10}px`;

      const tx = `${(Math.random() - 0.5) * 40}px`;
      const rot = `${(Math.random() - 0.5) * 70}deg`;
      heart.style.setProperty('--tx', tx);
      heart.style.setProperty('--rot', rot);

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    window.addEventListener('mousemove', (e) => spawnTrailHeart(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        spawnTrailHeart(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    const now = new Date();
    let targetYear = now.getFullYear();
    let targetDate = new Date(targetYear, 11, 13, 0, 0, 0);

    if (now.getTime() > targetDate.getTime()) {
      targetDate = new Date(targetYear + 1, 11, 13, 0, 0, 0);
    }

    function updateCountdown() {
      const currentTime = new Date().getTime();
      const diff = targetDate.getTime() - currentTime;

      if (diff <= 0) {
        document.getElementById('timer').innerText = "Happy Birthday! 🎉";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60)) / 1000 / 60);
      const secs = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('timer').innerText = 
        `${days}d ${hours}h ${mins}m ${secs}s`;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    const message = `To the one of the most important person in my life: ❤\n\nThere is very little left until your special day, and I cannot wait to celebrate you properly-filling your day with infinite hugs, kisses, and sweet surprises.\n\nThank you for simply existing and making every day so meaningful.\n\n- Forever your fan and your friend`;

    let charIdx = 0;
    const typewriterEl = document.getElementById('typewriter');

    function typeLetter() {
      if (charIdx < message.length) {
        typewriterEl.textContent += message.charAt(charIdx);
        charIdx++;
        setTimeout(typeLetter, 38);
      }
    }

    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let cWidth = container.clientWidth || 500;
    let cHeight = container.clientHeight || 640;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = cWidth * dpr;
    canvas.height = cHeight * dpr;
    ctx.scale(dpr, dpr);

    const isMobile = window.innerWidth <= 768;
    const heartOriginX = cWidth / 2;
    const heartOriginY = isMobile ? cHeight * 0.38 : 225;
    const heartScale = isMobile ? Math.min(cWidth, cHeight) * 0.024 : 14.2;

    function isInsideHeart(px, py, inset = 0) {
      const scale = heartScale * (16.0 - inset);
      const x = (px - heartOriginX) / scale;
      const y = -(py - heartOriginY) / scale;
      return Math.pow(x * x + y * y - 1, 3) - x * x * Math.pow(y, 3) <= 0;
    }

    const groundY = isMobile ? cHeight * 0.95 : 620;
    const trunkH = groundY - heartOriginY;

    const rawBranches = [
      {
        pts: [
          [heartOriginX, groundY],
          [heartOriginX, groundY - trunkH * 0.2],
          [heartOriginX, groundY - trunkH * 0.4],
          [heartOriginX, groundY - trunkH * 0.6],
          [heartOriginX - 1, groundY - trunkH * 0.78],
          [heartOriginX - 2, groundY - trunkH * 0.92]
        ],
        w: isMobile ? 12 : 18
      },
      {
        pts: [
          [heartOriginX, groundY - trunkH * 0.6],
          [heartOriginX - heartScale * 2.5, groundY - trunkH * 0.67],
          [heartOriginX - heartScale * 5.0, groundY - trunkH * 0.74],
          [heartOriginX - heartScale * 7.0, groundY - trunkH * 0.88]
        ],
        w: isMobile ? 6 : 8.5
      },
      {
        pts: [
          [heartOriginX - heartScale * 5.0, groundY - trunkH * 0.74],
          [heartOriginX - heartScale * 7.2, groundY - trunkH * 0.72],
          [heartOriginX - heartScale * 8.5, groundY - trunkH * 0.78]
        ],
        w: isMobile ? 3.5 : 4.8
      },
      {
        pts: [
          [heartOriginX - 1, groundY - trunkH * 0.78],
          [heartOriginX - heartScale * 1.5, groundY - trunkH * 0.92],
          [heartOriginX - heartScale * 2.2, groundY - trunkH * 1.08]
        ],
        w: isMobile ? 3.2 : 4.5
      },
      {
        pts: [
          [heartOriginX, groundY - trunkH * 0.56],
          [heartOriginX + heartScale * 2.5, groundY - trunkH * 0.64],
          [heartOriginX + heartScale * 5.0, groundY - trunkH * 0.73],
          [heartOriginX + heartScale * 7.0, groundY - trunkH * 0.88]
        ],
        w: isMobile ? 6 : 8.5
      },
      {
        pts: [
          [heartOriginX + heartScale * 5.0, groundY - trunkH * 0.73],
          [heartOriginX + heartScale * 7.2, groundY - trunkH * 0.72],
          [heartOriginX + heartScale * 8.5, groundY - trunkH * 0.78]
        ],
        w: isMobile ? 3.5 : 4.8
      },
      {
        pts: [
          [heartOriginX, groundY - trunkH * 0.7],
          [heartOriginX + heartScale * 2.2, groundY - trunkH * 0.8],
          [heartOriginX + heartScale * 4.8, groundY - trunkH * 0.92]
        ],
        w: isMobile ? 4.5 : 6.5
      }
    ];

    const branchSegments = [];
    rawBranches.forEach((branch, bIdx) => {
      const pts = branch.pts;
      for (let i = 0; i < pts.length - 1; i++) {
        const start = pts[i];
        const end = pts[i + 1];

        const startInside = isInsideHeart(start[0], start[1], 0.8);
        const endInside = isInsideHeart(end[0], end[1], 0.8);

        if (bIdx === 0 || (startInside && endInside)) {
          const dist = Math.hypot(end[0] - start[0], end[1] - start[1]);
          const taperWidth = branch.w * (1 - (i / pts.length) * 0.52);
          branchSegments.push({
            x1: start[0],
            y1: start[1],
            x2: end[0],
            y2: end[1],
            w: Math.max(2.0, taperWidth),
            dist: dist
          });
        }
      }
    });

    let currentBranchIndex = 0;
    let branchProgress = 0;

    function renderTreeFrame() {
      if (currentBranchIndex >= branchSegments.length) {
        setTimeout(shiftTreeAndBloom, 350);
        return;
      }

      const b = branchSegments[currentBranchIndex];
      const step = 0.16;
      const nextProgress = Math.min(1, branchProgress + step);

      const currX = b.x1 + (b.x2 - b.x1) * branchProgress;
      const currY = b.y1 + (b.y2 - b.y1) * branchProgress;
      const targetX = b.x1 + (b.x2 - b.x1) * nextProgress;
      const targetY = b.y1 + (b.y2 - b.y1) * nextProgress;

      ctx.save();
      ctx.strokeStyle = '#5c3818';
      ctx.lineWidth = b.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(currX, currY);
      ctx.lineTo(targetX, targetY);
      ctx.stroke();
      ctx.restore();

      branchProgress = nextProgress;
      if (branchProgress >= 1) {
        branchProgress = 0;
        currentBranchIndex++;
      }

      requestAnimationFrame(renderTreeFrame);
    }

    function shiftTreeAndBloom() {
      const canvasBox = document.getElementById('canvas-container');
      const infoPanel = document.getElementById('info-panel');
      canvasBox.classList.add('shifted');

      setTimeout(() => {
        infoPanel.classList.add('visible');
        startBlooming();
      }, isMobile ? 600 : 1300);
    }

    function getHeartCoords(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: heartOriginX + x * heartScale,
        y: heartOriginY + y * heartScale
      };
    }

    function drawMiniHeart(cx, cy, size, angle, color, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      const topCurveHeight = size * 0.3;
      ctx.moveTo(0, topCurveHeight);
      ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
      ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size);
      ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
      ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
      ctx.fill();
      ctx.restore();
    }

    const heartLeaves = [];
    const colors = ['#d90429', '#ef233c', '#e63946', '#e03131', '#f06595', '#ff4d6d', '#ff758f', '#ff8787', '#f783ac', '#ffccd5', '#ffb3c1'];

    branchSegments.forEach(seg => {
      const count = isMobile ? 24 : 35;
      for (let j = 0; j <= count; j++) {
        const t = j / count;
        const px = seg.x1 + (seg.x2 - seg.x1) * t + (Math.random() - 0.5) * (isMobile ? 10 : 16);
        const py = seg.y1 + (seg.y2 - seg.y1) * t + (Math.random() - 0.5) * (isMobile ? 10 : 16);
        if (isInsideHeart(px, py, 0.2)) {
          heartLeaves.push({
            x: px,
            y: py,
            targetSize: Math.random() * (isMobile ? 7 : 11) + (isMobile ? 6 : 10),
            currentSize: 0,
            alpha: 0,
            angle: (Math.random() - 0.5) * 0.9,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }
    });

    const maxLeaves = isMobile ? 2200 : 3500;
    while (heartLeaves.length < maxLeaves) {
      const t = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.52);
      const edgePt = getHeartCoords(t);
      const testX = heartOriginX + (edgePt.x - heartOriginX) * r;
      const testY = heartOriginY + (edgePt.y - heartOriginY) * r;

      if (isInsideHeart(testX, testY, 0)) {
        heartLeaves.push({
          x: testX,
          y: testY,
          targetSize: Math.random() * (isMobile ? 7 : 11) + (isMobile ? 5 : 9),
          currentSize: 0,
          alpha: 0,
          angle: (Math.random() - 0.5) * 0.9,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    const activeBlooms = [];
    let bloomIndex = 0;

    function startBlooming() {
      function animateBlooms() {
        if (bloomIndex < heartLeaves.length) {
          const batchCount = isMobile ? 20 : 28;
          for (let i = 0; i < batchCount && bloomIndex < heartLeaves.length; i++) {
            const leaf = heartLeaves[bloomIndex];
            activeBlooms.push(leaf);
            bloomIndex++;
          }
        }

        for (let i = activeBlooms.length - 1; i >= 0; i--) {
          const leaf = activeBlooms[i];
          leaf.currentSize += (leaf.targetSize - leaf.currentSize) * 0.15;
          leaf.alpha = Math.min(1, leaf.alpha + 0.12);

          drawMiniHeart(leaf.x, leaf.y, leaf.currentSize, leaf.angle, leaf.color, leaf.alpha);

          if (Math.abs(leaf.targetSize - leaf.currentSize) < 0.08 && leaf.alpha >= 0.99) {
            drawMiniHeart(leaf.x, leaf.y, leaf.targetSize, leaf.angle, leaf.color, 1);
            activeBlooms.splice(i, 1);
          }
        }

        if (bloomIndex < heartLeaves.length || activeBlooms.length > 0) {
          requestAnimationFrame(animateBlooms);
        } else {
          typeLetter();
        }
      }

      requestAnimationFrame(animateBlooms);
    }

    const card = document.getElementById('card-container');
    const overlay = document.getElementById('intro-overlay');
    const heartBtn = document.getElementById('intro-heart-btn');

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => card.classList.add('active'), 50);
    });

    heartBtn.addEventListener('click', () => {
      overlay.classList.add('dismissed');
      setTimeout(() => {
        overlay.style.display = 'none';
        renderTreeFrame();
      }, 950);
    });
  </script>
</body>
</html>
